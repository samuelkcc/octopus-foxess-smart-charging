name: Publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Verify tag matches package version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version.split('.').map((part, index) => index === 0 ? part : part.padStart(2, '0')).join('.')")"
      - name: Create release and upload both editions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Octopus_IGO_Smart_Charging_Detector.html \
            dist/Octopus_FoxESS_Raspberry_Pi.tar.gz \
            dist/install.sh \
            dist/uninstall.sh \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --latest
