name: Publish GitHub release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v2026.07.26.7

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Create tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Reusing existing tag $RELEASE_TAG"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
      - run: npm run check
      - name: Verify tag matches package version
        run: |
          test "$RELEASE_TAG" = "v$(node -p "const [year, month, day, ...rest] = require('./package.json').version.split('.'); [year, month.padStart(2, '0'), day.padStart(2, '0'), ...rest].join('.')")"
      - name: Create release and upload both editions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
            gh release upload "$RELEASE_TAG" \
              dist/Octopus_IGO_Smart_Charging_Detector.html \
              dist/Octopus_FoxESS_Raspberry_Pi.tar.gz \
              dist/install.sh \
              dist/uninstall.sh \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/Octopus_IGO_Smart_Charging_Detector.html \
              dist/Octopus_FoxESS_Raspberry_Pi.tar.gz \
              dist/install.sh \
              dist/uninstall.sh \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
