name: Publish GitHub release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v2.2.0

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Resolve release tag
        run: echo "RELEASE_TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Create tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Reusing existing tag $RELEASE_TAG"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
      - run: npm run check
      - run: npm run build:dev
        env:
          OCTOPUS_UI_COMMIT: ${{ github.sha }}
      - name: Build portable Windows app and complete release assets
        run: |
          node scripts/build-desktop.mjs
          node scripts/stage-release.mjs
      - name: Verify tag matches package version
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - name: Create release and upload web, Pi, and Windows editions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
            gh release upload "$RELEASE_TAG" \
              .build/release-"$RELEASE_TAG"/* \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              .build/release-"$RELEASE_TAG"/* \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

  macos:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run check
      - run: npm run build:dev
        env:
          OCTOPUS_UI_COMMIT: ${{ github.sha }}
      - name: Build and verify macOS Universal app
        run: node scripts/build-desktop.mjs --mac
      - name: Add macOS download and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          mkdir -p .build/mac-release
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir .build/mac-release
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const {version}=JSON.parse(await readFile('package.json','utf8'));
          const name=`SmartCharging-${version}-macOS-universal.zip`;
          const hash=createHash('sha256').update(await readFile(`dist/macos/${name}`)).digest('hex');
          const file='.build/mac-release/SHA256SUMS.txt';
          const lines=(await readFile(file,'utf8')).trim().split('\n').filter(line=>!line.endsWith(`  ${name}`));
          await writeFile(file,[...lines,`${hash}  ${name}`].sort().join('\n')+'\n');
          JS
          gh release upload "$RELEASE_TAG" dist/macos/SmartCharging-*-macOS-universal.zip .build/mac-release/SHA256SUMS.txt --clobber
